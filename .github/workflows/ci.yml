name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Install dependencies (also generates l10n)
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      # Goldens are generated on Windows; Linux text rendering differs, so CI
      # skips them. Run them locally with `flutter test --tags golden`.
      - name: Test
        run: flutter test --exclude-tags golden

  # F04: build the database from migrations + seed and run the pgTAP RLS tests.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start database (applies migrations and seed)
        run: supabase db start

      - name: Schema and RLS tests
        run: supabase test db

  # F05: sign-in rules in the auth-* Edge Functions (lockout, resend, blocked).
  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check

      - name: Type-check
        run: deno check */index.ts

      - name: Unit tests
        run: deno test _shared/
