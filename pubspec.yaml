name: k_e_commerce
description: "K E-Commerce — customer, business, rider and admin apps in one Flutter codebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

# Versions are pinned exactly; bump deliberately with `flutter pub upgrade`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: 1.0.8
  flutter_riverpod: 3.3.2
  go_router: 17.5.0
  intl: 0.20.2
  supabase_flutter: 2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
