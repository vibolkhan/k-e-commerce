name: k_e_commerce
description: "K E-Commerce — customer, business, rider and admin apps in one Flutter codebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

# Versions are pinned exactly; bump deliberately with `flutter pub upgrade`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: 1.0.8
  flutter_riverpod: 3.3.2
  go_router: 17.5.0
  intl: 0.20.2
  path_parsing: 1.1.0
  shared_preferences: 2.5.6
  supabase_flutter: 2.18.3
  google_sign_in: 7.2.0
  sign_in_with_apple: 8.1.0
  crypto: 3.0.7
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Bundled (not fetched at runtime) so the app works offline and goldens are
  # deterministic. SIL OFL 1.1 — licences in assets/fonts/.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: KantumruyPro
      fonts:
        - asset: assets/fonts/KantumruyPro-400.ttf
          weight: 400
        - asset: assets/fonts/KantumruyPro-500.ttf
          weight: 500
        - asset: assets/fonts/KantumruyPro-600.ttf
          weight: 600
        - asset: assets/fonts/KantumruyPro-700.ttf
          weight: 700
